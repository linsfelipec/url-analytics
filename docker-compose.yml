services:
  postgres:
    image: postgres:17-alpine
    container_name: url-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urlapp
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: url_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlapp -d url_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: